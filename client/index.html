    <script>
      (function () {
        try {
          var key = "portfolio-theme";
          var stored = localStorage.getItem(key) || "system";
          var valid = ["system", "light", "dark", "midnight", "aurora"];
          var preference = valid.indexOf(stored) >= 0 ? stored : "system";
          var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          var resolved = preference === "system" ? (prefersDark ? "dark" : "light") : preference;
          document.documentElement.dataset.themePreference = preference;
          document.documentElement.dataset.theme = resolved;
        } catch (error) {
          document.documentElement.dataset.themePreference = "system";
          document.documentElement.dataset.theme = "dark";
        }
      })();
    </script>
